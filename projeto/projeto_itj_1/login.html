
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vitalis-core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">
                <span class="icon">✚</span>
                <h1>Vitalis-core<span>+</span></h1>
            </div>

            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">
                Acesse sua conta e veja as informações das UBS.
            </p>

            <form>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

 


                <div class="options">
                    
                <p class="register-1">
                     Sou adm da UBS
                <a href="/projeto_itj_1/login_adm.htm"> clique aqui!</a>
                </p>

                    
                </div>

                <button type="submit"><a href=""></a>   Entrar</button>

            </form>

            <p class="register">
                Ainda não tem uma conta?
                <a href="/projeto_itj_1/cadrastro.html">Cadastre-se</a>
            </p>

           

            <div class="footer">
                © 2026 Vitalis-core | Todos os direitos reservados.
            </div>

        </div>

    </div>

</body>
</html>

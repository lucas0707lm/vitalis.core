<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de adm</title>
    <link rel="stylesheet" href="style_adm.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Vitalis-core +</h1>
        <p>Sistema de gerenciamento de saúde</p>
    </header>

    <main>
        <h2>Cadastro de adm</h2>
        <p class="subtitulo">Cadastre-se para gerenciar uma Unidade Básica de Saúde</p>

        <form>

         

            <h3>Administrador</h3>

            <div class="campo">
                <label>Nome completo</label>
                <input type="text" placeholder="Nome do responsável">
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input type="tel" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label>E-mail</label>
                <input type="email" placeholder="email@exemplo.com">
            </div>

            <h3>Endereço</h3>

            <div class="campo">
                <label>CEP</label>
                <input type="number" placeholder="00000-000">
            </div>

            <div class="campo">
                <label>Rua / Avenida</label>
                <input type="text" placeholder="Endereço da UBS">
            </div>

            <div class="linha">
                <div class="campo">
                    <label>Número</label>
                    <input type="number" placeholder="Nº">
                </div>

                <div class="campo">
                    <label>Bairro</label>
                    <input type="text" placeholder="Bairro">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label>Cidade</label>
                    <input type="text" placeholder="Cidade">
                </div>

                <div class="campo">
                    <label>Unidade</label>
                    <select>
                        <option value="">Selecione</option>
                        <option>Jardin do sol</option>
                        <option>Vila Operaria</option>
                        <option>Jardim Santana Novo Horizonte</option>
                        <option>Clinica da mulher </option>
                        <option> Rural </option>
                        <option> 50 casas </option>
                        
                    </select>
                </div>
            </div>

            

            <div class="botoes">
                <button type="submit">Cadastrar Administrador</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>

        </form>
    </main>

    <footer>
        Sistema VItalis-core © 2026
    </footer>

</div>

</body>
</html>
